<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài Tập Ôn Tập IOE Tiếng Anh</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; }
        .quiz-container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #0275d8; }
        .question { margin-bottom: 20px; font-weight: bold; }
        .answers { margin-bottom: 20px; }
        label { display: block; padding: 8px; background: #f8f9fa; margin-bottom: 5px; border-radius: 4px; cursor: pointer; }
        label:hover { background: #e9ecef; }
        button { display: block; width: 100%; padding: 10px; background: #0275d8; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; }
        button:hover { background: #01549b; }
        #result { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: center; color: #28a745; }
    </style>
</head>
<body>
<div class="quiz-container">
    <h1>BÀI ÔN TẬP IOE</h1>
    
    <!-- Câu 1 -->
    <div class="question">Câu 1: Chọn từ khác biệt (Odd one out):</div>
    <div class="answers">
        <label><input type="radio" name="q1" value="A"> A. Apple</label>
        <label><input type="radio" name="q1" value="B"> B. Banana</label>
        <label><input type="radio" name="q1" value="C"> C. Cat</label>
        <label><input type="radio" name="q1" value="D"> D. Orange</label>
    </div>

    <!-- Câu 2 -->
    <div class="question">Câu 2: He ________ to school every day.</div>
    <div class="answers">
        <label><input type="radio" name="q2" value="A"> A. go</label>
        <label><input type="radio" name="q2" value="B"> B. goes</label>
        <label><input type="radio" name="q2" value="C"> C. going</label>
        <label><input type="radio" name="q2" value="D"> D. went</label>
    </div>

    <button onclick="checkAnswers()">NỘP BÀI</button>
    <div id="result"></div>
</div>

<script>
    function checkAnswers() {
        let score = 0;
        let q1 = document.querySelector('input[name="q1"]:checked');
        let q2 = document.querySelector('input[name="q2"]:checked');
        
        if(q1 && q1.value === "C") score++;
        if(q2 && q2.value === "B") score++;
        
        document.getElementById('result').innerText = "Bạn đã đúng " + score + "/2 câu hỏi!";
    }
</script>
</body>
</html>
